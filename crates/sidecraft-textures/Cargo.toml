[package]
name = "sidecraft-textures"
version = "0.1.0"
edition = "2024"
description = "Deterministic pixel-art texture-pack generator and validator for voxel games"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["pixel-art", "textures", "voxel", "procedural-generation"]
categories = ["command-line-utilities", "game-development", "graphics"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27"
toml = "1.1.4"
