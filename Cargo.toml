[package]
name = "sidecraft"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = { version = "0.7.0", default-features = false, features = ["2d", "f32", "parry-f32", "parallel"] }
bevy = { version = "0.19.0", default-features = false, features = ["2d", "3d", "ui"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27"
zstd = "0.13.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
